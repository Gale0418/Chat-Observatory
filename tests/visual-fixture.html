<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat Observatory Visual Fixture</title>
  <link rel="stylesheet" href="../content.css">
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      min-height: 100%;
      overflow: hidden;
      background: #0f0f10;
      color: white;
      font-family: Roboto, "Noto Sans TC", sans-serif;
    }

    yt-live-chat-app {
      height: 100%;
      display: block;
    }

    yt-live-chat-renderer {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    yt-live-chat-header-renderer {
      min-height: 48px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid currentColor;
    }

    yt-live-chat-header-renderer #header-buttons,
    yt-live-chat-message-input-renderer #buttons {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #chat-messages {
      flex: 1 1 auto;
      min-height: 0;
    }

    #chat-messages,
    #chat-messages > #contents,
    yt-live-chat-item-list-renderer {
      height: 100%;
      min-height: 0;
      display: block;
      background: #0f0f10;
    }

    #item-scroller {
      height: 100%;
      min-height: 0;
      display: block;
      overflow-y: auto;
      overscroll-behavior: contain;
      background: #0f0f10;
    }

    #input-panel {
      flex: 0 0 auto;
    }

    yt-live-chat-message-input-renderer {
      display: block;
      padding: 12px;
    }

    yt-live-chat-message-input-renderer #input-container {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      min-height: 42px;
      padding: 6px 8px 6px 14px;
      border: 1px solid currentColor;
      border-radius: 12px;
    }

    yt-live-chat-message-input-renderer #input {
      min-width: 0;
      padding: 6px 0;
      outline: none;
    }

    #emoji-button,
    #send-button,
    yt-live-chat-header-renderer button,
    yt-emoji-picker-renderer button {
      display: inline-grid;
      place-items: center;
      min-width: 36px;
      min-height: 36px;
      padding: 6px;
      border: 0;
      border-radius: 9px;
      font: inherit;
      background: transparent;
    }

    yt-emoji-picker-renderer {
      display: block;
      margin: 0 12px 12px;
      padding: 10px;
      border: 1px solid currentColor;
      border-radius: 12px;
    }

    yt-emoji-picker-renderer #categories,
    yt-emoji-picker-renderer #emoji-grid {
      display: flex;
      gap: 6px;
    }

    yt-emoji-picker-renderer #categories {
      padding-bottom: 8px;
      border-bottom: 1px solid currentColor;
    }

    #items {
      display: block;
      padding: 1px 12px 24px;
    }

    yt-live-chat-text-message-renderer,
    yt-live-chat-paid-message-renderer,
    yt-live-chat-membership-item-renderer {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 14px;
      align-items: start;
      background: rgba(255, 255, 255, 0.025);
    }

    #avatar {
      display: block;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(145deg, #484b54, #23252b);
    }

    #content {
      display: block;
    }

    #author-name,
    #message {
      display: block;
    }

    #author-name {
      margin-bottom: 3px;
      color: #aaa;
    }

    .paid {
      background: linear-gradient(100deg, rgba(17, 140, 190, 0.55), rgba(17, 140, 190, 0.18));
    }

    .member {
      background: linear-gradient(100deg, rgba(16, 120, 90, 0.45), rgba(16, 120, 90, 0.12));
    }
  </style>
</head>
<body>
  <yt-live-chat-app>
    <yt-live-chat-renderer id="chat">
      <yt-live-chat-header-renderer>
        <strong>LIVE CHAT · SYNTHETIC DEMO</strong>
        <span id="header-buttons">
          <button type="button" aria-label="聊天選項">⋮</button>
          <button type="button" aria-label="關閉聊天室">×</button>
        </span>
      </yt-live-chat-header-renderer>
      <div id="chat-messages">
        <div id="contents">
          <yt-live-chat-item-list-renderer>
            <div id="item-scroller" class="yt-live-chat-item-list-renderer">
              <div id="items" class="yt-live-chat-item-list-renderer">
    <yt-live-chat-text-message-renderer>
      <span id="avatar"></span>
      <span id="content">
        <span id="author-name">TEST01</span>
        <span id="message">Hello from the synthetic demo stream! 🌌</span>
      </span>
    </yt-live-chat-text-message-renderer>

    <yt-live-chat-paid-message-renderer class="paid">
      <span id="avatar"></span>
      <span id="content">
        <span id="author-name">TEST02</span>
        <span id="purchase-amount">US$5.00</span>
        <span id="message">こんにちは！これはテスト配信です ✨</span>
      </span>
    </yt-live-chat-paid-message-renderer>

    <yt-live-chat-membership-item-renderer class="member">
      <span id="avatar"></span>
      <span id="content">
        <span id="author-name">TEST03</span>
        <span id="header-subtext">Synthetic test member</span>
        <span id="message">Bonjour ! Ceci est une simulation multilingue.</span>
      </span>
    </yt-live-chat-membership-item-renderer>
              </div>
            </div>
          </yt-live-chat-item-list-renderer>
        </div>
      </div>
      <div id="input-panel" class="yt-live-chat-renderer">
        <yt-live-chat-message-input-renderer>
          <div id="input-container">
            <div id="input" contenteditable="true" data-placeholder="Type a synthetic message">Testing chat input…</div>
            <span id="buttons">
              <button id="emoji-button" type="button" aria-label="Pick a demo emoji">☺</button>
              <button id="send-button" type="button" aria-label="Send synthetic message">➤</button>
            </span>
          </div>
        </yt-live-chat-message-input-renderer>
        <yt-emoji-picker-renderer aria-label="Synthetic emoji">
          <div id="categories">
            <button type="button" aria-label="Test favorites">★</button>
            <button type="button" aria-label="Test smiles">☺</button>
          </div>
          <div id="emoji-grid">
            <button type="button" aria-label="Synthetic smile">😀</button>
            <button type="button" aria-label="Synthetic hearts">😍</button>
            <button type="button" aria-label="Synthetic cheer">🎉</button>
          </div>
        </yt-emoji-picker-renderer>
      </div>
    </yt-live-chat-renderer>
  </yt-live-chat-app>

  <script>
    const fixtureParams = new URLSearchParams(location.search);
    const fixtureTheme = fixtureParams.get("theme") || "black";
    const fixtureCollapsed = fixtureParams.has("collapsed");
    const fixtureHasVoice = !fixtureParams.has("no-voice");

    const fixtureChrome = {
      i18n: {
        getMessage(key) {
          return key === "@@ui_locale" ? "zh_TW" : "";
        }
      },
      storage: {
        local: {
          async get(defaults) {
            return {
              ...defaults,
              theme: fixtureTheme,
              isCollapsed: fixtureCollapsed,
              ttsEnabled: true,
              ttsReadName: true,
              highlightKeywords: "TEST",
              uiLocale: "auto"
            };
          },
          async set() {}
        }
      }
    };
    try {
      if (typeof chrome === "object" && chrome) {
        Object.defineProperty(chrome, "storage", {
          value: fixtureChrome.storage,
          configurable: true
        });
      } else if (!window.chrome) {
        Object.defineProperty(window, "chrome", {
          value: fixtureChrome,
          configurable: true
        });
      } else if (!window.chrome.storage) {
        Object.defineProperty(window.chrome, "storage", {
          value: fixtureChrome.storage,
          configurable: true
        });
      }
    } catch {
      // 部分 Chromium 將內建物件設為唯讀；content.js 會安全回退至預設值。
    }

    const FixtureUtterance = class {
      constructor(text) {
        this.text = text;
      }
    };
    const fixtureSpeechSynthesis = {
      getVoices() {
        return fixtureHasVoice ? [{
          name: "Microsoft HsiaoChen",
          lang: "zh-TW",
          voiceURI: "fixture-voice",
          localService: true
        }] : [];
      },
      addEventListener() {},
      removeEventListener() {},
      speak() {},
      cancel() {}
    };
    if (!window.SpeechSynthesisUtterance) window.SpeechSynthesisUtterance = FixtureUtterance;
    if (!window.speechSynthesis) window.speechSynthesis = fixtureSpeechSynthesis;
  </script>
  <script src="../content.js"></script>
  <script>
    // Chromium 的內建 chrome／speechSynthesis 物件可能無法被頁面覆寫；
    // 最終以公開 UI 操作建立可重現的視覺狀態。
    const prepareFixture = () => {
      const keywords = document.getElementById("chatobs-keywords-input");
      const themeSelect = document.getElementById("chatobs-theme-select");
      const panelBody = document.getElementById("chatobs-panel-body");
      const collapseButton = document.getElementById("chatobs-collapse-button");
      const voiceSelect = document.getElementById("chatobs-voice-select");
      if (!keywords || !themeSelect || !panelBody || !collapseButton || !voiceSelect) return false;

      keywords.value = "TEST";
      keywords.dispatchEvent(new Event("input", { bubbles: true }));

      if (themeSelect.value !== fixtureTheme) {
        themeSelect.value = fixtureTheme;
        themeSelect.dispatchEvent(new Event("change", { bubbles: true }));
      }
      if (panelBody.hidden !== fixtureCollapsed) {
        collapseButton.click();
      }

      if (fixtureHasVoice) {
        voiceSelect.replaceChildren(new Option("美佳 · zh-TW", "fixture-voice"));
        voiceSelect.value = "fixture-voice";
      }
      document.body.dataset.fixtureReady = "true";
      return true;
    };

    const fixtureDeadline = performance.now() + 5000;
    const waitForFixture = () => {
      if (prepareFixture()) return;
      if (performance.now() >= fixtureDeadline) {
        document.body.dataset.fixtureReady = "error";
        console.error("CO visual fixture timed out while waiting for the control panel.");
        return;
      }
      window.requestAnimationFrame(waitForFixture);
    };
    window.requestAnimationFrame(waitForFixture);
  </script>
</body>
</html>
