<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YT Chat Enlarger Visual Fixture</title>
  <link rel="stylesheet" href="../content.css">
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      min-height: 100%;
      overflow: hidden;
      background: #0f0f10;
      color: white;
      font-family: Roboto, "Noto Sans TC", sans-serif;
    }

    yt-live-chat-app {
      height: 100%;
      display: block;
    }

    yt-live-chat-renderer {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    #chat-messages {
      flex: 1 1 auto;
      min-height: 0;
    }

    #chat-messages,
    #chat-messages > #contents,
    yt-live-chat-item-list-renderer {
      height: 100%;
      min-height: 0;
      display: block;
      background: #0f0f10;
    }

    #item-scroller {
      height: 100%;
      min-height: 0;
      display: block;
      overflow-y: auto;
      overscroll-behavior: contain;
      background: #0f0f10;
    }

    #input-panel {
      flex: 0 0 auto;
    }

    yt-live-chat-message-input-renderer {
      display: block;
      padding: 12px;
    }

    yt-live-chat-message-input-renderer #input-container {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      min-height: 42px;
      padding: 6px 8px 6px 14px;
      border: 1px solid currentColor;
      border-radius: 12px;
    }

    yt-live-chat-message-input-renderer #input {
      min-width: 0;
      padding: 6px 0;
      outline: none;
    }

    #emoji-button,
    yt-emoji-picker-renderer button {
      display: inline-grid;
      place-items: center;
      min-width: 36px;
      min-height: 36px;
      padding: 6px;
      border: 0;
      border-radius: 9px;
      font: inherit;
      background: transparent;
    }

    yt-emoji-picker-renderer {
      display: block;
      margin: 0 12px 12px;
      padding: 10px;
      border: 1px solid currentColor;
      border-radius: 12px;
    }

    yt-emoji-picker-renderer #categories,
    yt-emoji-picker-renderer #emoji-grid {
      display: flex;
      gap: 6px;
    }

    yt-emoji-picker-renderer #categories {
      padding-bottom: 8px;
      border-bottom: 1px solid currentColor;
    }

    #items {
      display: block;
      padding: 1px 12px 24px;
    }

    yt-live-chat-text-message-renderer,
    yt-live-chat-paid-message-renderer,
    yt-live-chat-membership-item-renderer {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 14px;
      align-items: start;
      background: rgba(255, 255, 255, 0.025);
    }

    #avatar {
      display: block;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(145deg, #484b54, #23252b);
    }

    #content {
      display: block;
    }

    #author-name,
    #message {
      display: block;
    }

    #author-name {
      margin-bottom: 3px;
      color: #aaa;
    }

    .paid {
      background: linear-gradient(100deg, rgba(17, 140, 190, 0.55), rgba(17, 140, 190, 0.18));
    }

    .member {
      background: linear-gradient(100deg, rgba(16, 120, 90, 0.45), rgba(16, 120, 90, 0.12));
    }
  </style>
</head>
<body>
  <yt-live-chat-app>
    <yt-live-chat-renderer id="chat">
      <div id="chat-messages">
        <div id="contents">
          <yt-live-chat-item-list-renderer>
            <div id="item-scroller" class="yt-live-chat-item-list-renderer">
              <div id="items" class="yt-live-chat-item-list-renderer">
    <yt-live-chat-text-message-renderer>
      <span id="avatar"></span>
      <span id="content">
        <span id="author-name">小明</span>
        <span id="message">主人，右邊那條路好像還有一個寶箱！</span>
      </span>
    </yt-live-chat-text-message-renderer>

    <yt-live-chat-paid-message-renderer class="paid">
      <span id="avatar"></span>
      <span id="content">
        <span id="author-name">支持者阿華</span>
        <span id="purchase-amount">NT$150</span>
        <span id="message">今天的直播很有趣，慢慢玩就好～</span>
      </span>
    </yt-live-chat-paid-message-renderer>

    <yt-live-chat-membership-item-renderer class="member">
      <span id="avatar"></span>
      <span id="content">
        <span id="author-name">綿羊會員</span>
        <span id="header-subtext">加入會員滿 6 個月</span>
        <span id="message">半年簽到！大家晚上好。</span>
      </span>
    </yt-live-chat-membership-item-renderer>
              </div>
            </div>
          </yt-live-chat-item-list-renderer>
        </div>
      </div>
      <div id="input-panel">
        <yt-live-chat-message-input-renderer>
          <div id="input-container">
            <div id="input" contenteditable="true" data-placeholder="輸入訊息">正在輸入文字</div>
            <button id="emoji-button" type="button" aria-label="選擇表情符號">☺</button>
          </div>
        </yt-live-chat-message-input-renderer>
        <yt-emoji-picker-renderer aria-label="表情符號">
          <div id="categories">
            <button type="button" aria-label="常用表情">★</button>
            <button type="button" aria-label="笑臉表情">☺</button>
          </div>
          <div id="emoji-grid">
            <button type="button" aria-label="笑臉">😀</button>
            <button type="button" aria-label="愛心眼">😍</button>
            <button type="button" aria-label="歡呼">🎉</button>
          </div>
        </yt-emoji-picker-renderer>
      </div>
    </yt-live-chat-renderer>
  </yt-live-chat-app>

  <script>
    const fixtureParams = new URLSearchParams(location.search);
    const fixtureMode = fixtureParams.get("mode") || "complete";
    const fixtureTheme = fixtureParams.get("theme") || "ember";
    const fixtureCollapsed = fixtureParams.has("collapsed");
    const fixtureHasVoice = !fixtureParams.has("no-voice");

    const fixtureChrome = {
      storage: {
        local: {
          async get(defaults) {
            return {
              ...defaults,
              mode: fixtureMode,
              theme: fixtureTheme,
              isCollapsed: fixtureCollapsed,
              ttsEnabled: true,
              ttsReadName: true,
              highlightKeywords: "寶箱"
            };
          },
          async set() {}
        }
      }
    };
    try {
      if (!window.chrome) window.chrome = fixtureChrome;
      else if (!window.chrome.storage) window.chrome.storage = fixtureChrome.storage;
    } catch {
      // 部分 Chromium 將內建物件設為唯讀；content.js 會安全回退至預設值。
    }

    const FixtureUtterance = class {
      constructor(text) {
        this.text = text;
      }
    };
    const fixtureSpeechSynthesis = {
      getVoices() {
        return fixtureHasVoice ? [{
          name: "Microsoft HsiaoChen",
          lang: "zh-TW",
          voiceURI: "fixture-voice",
          localService: true
        }] : [];
      },
      addEventListener() {},
      removeEventListener() {},
      speak() {},
      cancel() {}
    };
    if (!window.SpeechSynthesisUtterance) window.SpeechSynthesisUtterance = FixtureUtterance;
    if (!window.speechSynthesis) window.speechSynthesis = fixtureSpeechSynthesis;
  </script>
  <script src="../content.js"></script>
  <script>
    // Chromium 的內建 chrome／speechSynthesis 物件可能無法被頁面覆寫；
    // 最終以公開 UI 操作建立可重現的視覺狀態。
    const prepareFixture = () => {
      const keywords = document.getElementById("ytce-keywords-input");
      if (!keywords) return false;

      keywords.value = "寶箱";
      keywords.dispatchEvent(new Event("input", { bubbles: true }));

      if (!document.querySelector(`[data-mode="${fixtureMode}"]`).classList.contains("is-active")) {
        document.querySelector(`[data-mode="${fixtureMode}"]`).click();
      }
      if (!document.querySelector(`[data-theme="${fixtureTheme}"]`).classList.contains("is-active")) {
        document.querySelector(`[data-theme="${fixtureTheme}"]`).click();
      }
      const panelBody = document.getElementById("ytce-panel-body");
      if (panelBody.hidden !== fixtureCollapsed) {
        document.getElementById("ytce-collapse-button").click();
      }

      const voiceSelect = document.getElementById("ytce-voice-select");
      if (fixtureHasVoice) {
        voiceSelect.replaceChildren(new Option("美佳 · zh-TW", "fixture-voice"));
        voiceSelect.value = "fixture-voice";
      }
      document.body.dataset.fixtureReady = "true";
      return true;
    };

    const fixtureDeadline = performance.now() + 5000;
    const waitForFixture = () => {
      if (prepareFixture()) return;
      if (performance.now() >= fixtureDeadline) {
        document.body.dataset.fixtureReady = "error";
        console.error("YTCE visual fixture timed out while waiting for the control panel.");
        return;
      }
      window.requestAnimationFrame(waitForFixture);
    };
    window.requestAnimationFrame(waitForFixture);
  </script>
</body>
</html>
